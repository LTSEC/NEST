all:
  vars:
    ansible_user: root
    ansible_password: changeme
    ansible_ssh_private_key_file: ~/.ssh/id_rsa

  children:
    standard_linux:
      hosts:
        10.0.0.10:
        10.0.0.11:
      vars:
        ansible_user: root # Standard SSH connection
        
    vyos_routers:
      hosts:
        10.0.0.20:
      vars:
        ansible_connection: network_cli
        ansible_network_os: vyos
        ansible_user: vyos
        ansible_password: vyos
        
    mikrotik_routers:
      hosts:
        10.0.0.30:
      vars:
        ansible_connection: network_cli
        ansible_network_os: routeros
        ansible_user: admin