services:
  frontend:
    build:
      context: .
      dockerfile: nest-frontend/Dockerfile
    ports:
      - "${APP_PORT:-5173}:${APP_PORT:-5173}"
    environment:
      APP_PORT: ${APP_PORT:-5173}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      - db
      - backend

  backend:
    build:
      context: .
      dockerfile: backend_showcase/Dockerfile
    ports:
      - "${BACKEND_PORT:-4545}:${BACKEND_PORT:-4545}"
    environment:
      PORT: ${BACKEND_PORT:-4545}

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nestapp}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./nest-frontend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  db_data:
