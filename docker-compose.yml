version: '3.9'

services:
  frontend:
    build:
      context: ./nest-frontend
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-5173}:${APP_PORT:-5173}"
    environment:
      APP_PORT: ${APP_PORT:-5173}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nestapp}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./nest-frontend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  db_data:
