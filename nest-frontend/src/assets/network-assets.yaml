{
  "routers": [
    { "id": "-1", "label": "Blank" },
    { "id": "2", "label": "VyOS" }
  ],
  "hosts": [
    { "id": "-2", "label": "Blank" },
    { "id": "0", "label": "Debian" },
    { "id": "1", "label": "Ubuntu" }
  ],
  "services": [
    {
      "id": "http",
      "name": "HTTP",
      "description": "Generic web server listening for HTTP traffic",
      "protocol": "tcp",
      "defaultPort": 80,
      "roles": ["webserver"]
    },
    {
      "id": "https",
      "name": "HTTPS",
      "description": "TLS-enabled web server endpoint",
      "protocol": "tcp",
      "defaultPort": 443,
      "roles": ["webserver"]
    },
    {
      "id": "ssh",
      "name": "SSH",
      "description": "Secure shell for remote access",
      "protocol": "tcp",
      "defaultPort": 22,
      "roles": ["admin"]
    },
    {
      "id": "dns",
      "name": "DNS",
      "description": "Authoritative DNS service",
      "protocol": "udp",
      "defaultPort": 53,
      "roles": ["dns"]
    },
    {
      "id": "postgresql",
      "name": "PostgreSQL",
      "description": "PostgreSQL database server",
      "protocol": "tcp",
      "defaultPort": 5432,
      "roles": ["database"]
    },
    {
      "id": "mariadb",
      "name": "MariaDB/MySQL",
      "description": "MySQL-compatible database service",
      "protocol": "tcp",
      "defaultPort": 3306,
      "roles": ["database"]
    }
  ],
  "customServices": [
    {
      "id": "web-db-bundle",
      "name": "Test WebserverDB",
      "description": "Paired web server and database stack used for integration tests.",
      "requiredRoles": [
        { "role": "webserver", "serviceId": "http", "hostImageId": "0", "defaultPort": 8080 },
        { "role": "database", "serviceId": "postgresql", "hostImageId": "1", "defaultPort": 5432 }
      ],
      "dependencies": ["dns"]
    }
  ]
}
