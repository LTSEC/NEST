<div class="container">
  <div class="left">
    <div class="header">NEST</div>
    <img src="assets/nest.png" alt="NEST Logo">
  </div>

  <div class="right">
    <div class="header">
      {{ isDevMode ? 'Dev Login' : 'Login' }}
    </div>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm" class="login-form">
      <input
        name="username"
        [(ngModel)]="username"
        type="text"
        placeholder="Username"
        class="entry-box"
      />

      <input
        name="password"
        [(ngModel)]="password"
        type="password"
        placeholder="Password"
        class="entry-box"
      />

      <button
        type="submit"
        [disabled]="loginForm.invalid"
      >
        {{ isDevMode ? 'Login as Dev' : 'Login' }}
      </button>

      <div class="login-footer">
        <a
          (click)="toggleDevMode()"
          class="admin-link"
          role="button"
        >
          {{ isDevMode ? 'Back to User Login' : 'Dev Login' }}
        </a>
      </div>
    </form>
  </div>
</div>
